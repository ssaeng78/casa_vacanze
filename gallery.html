<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="แกลเลอรีภาพ Casa Vacanze Toscana Valley เขาใหญ่">
  <title>Gallery — Casa Vacanze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine: #073d37;
      --deep: #062c2b;
      --cream: #f7f0e3;
      --paper: #fbf7ef;
      --gold: #c39135;
      --ink: #18332e;
      --muted: #687771;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Noto Sans Thai", sans-serif;
      line-height: 1.65;
    }
    body.modal-open { overflow: hidden; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1180px, calc(100% - 40px)); margin: auto; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(251, 247, 239, 0.92);
      border-bottom: 1px solid rgba(7, 61, 55, 0.1);
      backdrop-filter: blur(14px);
    }
    nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .menu-container { position: relative; }
    .menu-btn {
      display: flex; align-items: center; gap: 8px;
      background: none; border: none; cursor: pointer;
      padding: 6px 10px; color: #073d37;
      font-family: "Noto Sans Thai", sans-serif;
      font-weight: 700; font-size: 0.95rem; border-radius: 8px;
    }
    .menu-btn:hover { background: rgba(7, 61, 55, 0.06); }
    .menu-dropdown {
      position: absolute; top: 100%; right: 0; margin-top: 12px;
      width: 240px; background: #24262b; border-radius: 16px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 10px; display: none; flex-direction: column; z-index: 100; color: #fff;
    }
    .menu-dropdown.is-open { display: flex; }
    .dropdown-header {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.4); margin: 8px 12px 10px;
    }
    .menu-dropdown a {
      display: block; padding: 12px 16px; color: #e4e6ea;
      font-size: 0.95rem; border-radius: 10px; font-weight: 500;
    }
    .menu-dropdown a:hover,
    .menu-dropdown a[aria-current="page"] {
      background: rgba(255, 255, 255, 0.12); color: #fff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .monogram {
      width: 42px; height: 42px; display: grid; place-items: center;
      border: 1px solid var(--gold); border-radius: 50%;
      color: var(--gold); font: 1.15rem "DM Serif Display", serif;
    }
    .brand-copy { font: 1.35rem "DM Serif Display", serif; letter-spacing: 0.03em; }
    .brand-copy small {
      display: flex; align-items: center; gap: 6px; margin-top: 2px;
      color: #51605c; font: 700 0.66rem/1.45 "Noto Sans Thai", sans-serif;
      letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    }
    .brand-copy small span:first-child:after { content: "·"; }
    .line-icon-only {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; color: #06c755 !important;
    }
    .line-icon-only svg { width: 100%; height: 100%; fill: currentColor; }

    .page-hero {
      padding: 54px 0 28px;
      background:
        radial-gradient(circle at top right, rgba(195, 145, 53, 0.16), transparent 42%),
        linear-gradient(180deg, var(--cream), var(--paper));
      text-align: center;
    }
    .kicker {
      color: var(--gold);
      font: 700 0.76rem/1 "Noto Sans Thai", sans-serif;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font: clamp(2.4rem, 5vw, 4.2rem)/1 "DM Serif Display", serif;
    }
    h1 span {
      display: block;
      margin-top: 10px;
      font: 600 clamp(1.05rem, 2vw, 1.45rem)/1.4 "Noto Sans Thai", sans-serif;
    }
    .lead {
      max-width: 560px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .gallery-section { padding: 36px 0 80px; }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .photo-grid button {
      all: unset;
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      cursor: zoom-in;
      background: #e8dfcf;
    }
    .photo-grid button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .photo-grid img {
      transition: transform 0.45s ease;
    }
    .photo-grid button:hover img {
      transform: scale(1.04);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      width: auto;
      height: auto;
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      cursor: zoom-out;
    }

    footer {
      padding: 24px 0;
      color: #bfc9c4;
      background: #031e1d;
      font-size: 0.78rem;
      text-align: center;
    }

    @media (max-width: 800px) {
      .wrap { width: calc(100% - 28px); }
      nav {
        height: auto;
        padding: 12px 0;
        flex-wrap: wrap;
      }
      .brand-copy { font-size: 1rem; }
      .brand-copy small {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        font-size: 0.43rem;
      }
      .brand-copy small span:first-child:after { display: none; }
      .nav-right { flex-direction: row-reverse; }
      .menu-text { display: none; }
      .menu-btn { padding: 6px 2px; }
      .menu-dropdown {
        position: fixed;
        top: 74px;
        left: 12px;
        right: 12px;
        width: auto;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      }
      .photo-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .page-hero { padding: 36px 0 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="wrap">
      <a class="brand" href="https://casavacanze-khaoyai.com/">
        <span class="monogram">CV</span>
        <span class="brand-copy">Casa Vacanze<small><span>Toscana Valley</span><span>Khao Yai · Thailand</span></small></span>
      </a>
      <div class="nav-right">
        <div class="menu-container">
          <button class="menu-btn" aria-label="Toggle menu" onclick="this.nextElementSibling.classList.toggle('is-open')">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            <span class="menu-text">Menu</span>
          </button>
          <div class="menu-dropdown">
            <div class="dropdown-header">BROWSE</div>
            <a href="https://casavacanze-khaoyai.com/">Main Entrance</a>
            <a href="https://casavacanze-khaoyai.com/explore-villa">Explore the Villa</a>
            <a href="https://casavacanze-khaoyai.com/toscana-valley">About toscana-valley</a>
            <a href="https://casavacanze-khaoyai.com/gallery" aria-current="page">Gallery</a>
          </div>
        </div>
        <a class="line-icon-only" href="https://casavacanze-khaoyai.com/#contact" aria-label="Contact us via LINE">
          <svg viewBox="0 0 24 24"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="kicker">Casa Vacanze</div>
        <h1>Gallery<span>แกลเลอรีภาพบ้านพัก</span></h1>
        <p class="lead">แตะรูปเพื่อขยาย — แตะอีกครั้งเพื่อย่อกลับ</p>
      </div>
    </section>

    <section class="gallery-section">
      <div class="wrap">
        <div class="photo-grid" id="photo-grid" aria-label="แกลเลอรีภาพ"></div>
      </div>
    </section>
  </main>

  <footer>© 2026 Casa Vacanze · Private Pool Villa · Toscana Valley · Khao Yai</footer>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="ขยายภาพ">
    <img src="" alt="" id="lightbox-image">
  </div>

  <script>
    // ใส่ชื่อไฟล์รูปในโฟลเดอร์ images/gallery/ ที่นี่
    // อัปโหลดรูปเข้า images/gallery/ แล้วเพิ่มชื่อไฟล์ในรายการนี้
    const GALLERY_IMAGES = [
      "images/gallery/01.jpg",
      "images/gallery/02.jpg",
      "images/gallery/03.jpg",
      "images/gallery/04.jpg",
      "images/gallery/05.jpg",
      "images/gallery/06.jpg",
      "images/gallery/07.jpg",
      "images/gallery/08.jpg"
    ];

    const grid = document.getElementById("photo-grid");
    const box = document.getElementById("lightbox");
    const image = document.getElementById("lightbox-image");

    const openLightbox = (src, alt) => {
      image.src = src;
      image.alt = alt || "";
      box.classList.add("open");
      box.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
    };

    const closeLightbox = () => {
      box.classList.remove("open");
      box.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      image.src = "";
      image.alt = "";
    };

    GALLERY_IMAGES.forEach((src, index) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", `ขยายรูปที่ ${index + 1}`);
      btn.innerHTML = `<img src="${src}" alt="Gallery photo ${index + 1}" loading="lazy">`;
      btn.addEventListener("click", () => openLightbox(src, `Gallery photo ${index + 1}`));
      grid.appendChild(btn);
    });

    // กดรูปที่ขยาย หรือพื้นดำ = ย่อกลับ
    box.addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && box.classList.contains("open")) closeLightbox();
    });

    document.addEventListener("click", (e) => {
      const menu = document.querySelector(".menu-dropdown");
      const btn = document.querySelector(".menu-btn");
      if (menu && menu.classList.contains("is-open") && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove("is-open");
      }
    });
  </script>
</body>
</html>
