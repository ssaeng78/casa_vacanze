name: Sync gallery order

# Pull the live gallery order and commit it into manifest.json
# so static hosting stays aligned. Uses the default GITHUB_TOKEN.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [gallery-order-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live order and update manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'images/gallery/manifest.json';
            const endpoints = [
              'https://casa-vacanze.pages.dev/api/gallery-order',
              'https://casa-gallery-order.fancy-angelfish.workers.dev/',
            ];

            let images = null;
            for (const url of endpoints) {
              try {
                const res = await fetch(url, {
                  headers: { Accept: 'application/json', 'User-Agent': 'casa-gallery-sync' },
                });
                if (!res.ok) continue;
                const ct = res.headers.get('content-type') || '';
                if (!ct.includes('application/json')) continue;
                const data = await res.json();
                if (Array.isArray(data.images) && data.images.length) {
                  images = data.images;
                  core.info(`Loaded ${images.length} images from ${url}`);
                  break;
                }
              } catch (err) {
                core.warning(`Failed ${url}: ${err.message}`);
              }
            }

            if (!images) {
              core.warning('No live order found; skipping');
              return;
            }

            const next = `${JSON.stringify({ images }, null, 2)}\n`;
            const prev = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            if (prev === next) {
              core.info('Manifest already up to date');
              return;
            }

            fs.writeFileSync(path, next);
            core.info('Manifest updated on disk');

      - name: Commit manifest if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(gallery): sync photo order"
          file_pattern: images/gallery/manifest.json
